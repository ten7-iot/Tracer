[package]
name = "tracer-boot-nrf52840"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tracer-boot-nrf52840"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-time = "0.5.1"
panic-halt = "1.0.0"
tracer-core.workspace = true
tracer-lib.workspace = true
tracer-lib-gps-ublox-m10 = { workspace = true, optional = true }

[features]
default = []
gps-ublox-m10 = ["dep:tracer-lib-gps-ublox-m10"]
